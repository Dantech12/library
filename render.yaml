# Render Blueprint for BookBridge (https://render.com/docs/blueprint-spec).
# Render asks for every value marked `sync: false` when you create the Blueprint.
# Secrets are entered in Render's dashboard, never committed here.
services:
  - type: web
    name: bookbridge
    runtime: node
    # Free plan: no disk, and it sleeps after about 15 minutes without visitors (the next visit takes about a minute).
    # The free plan's disk is wiped on every restart, so school accounts and student logins are kept
    # in a free MongoDB Atlas database instead (MONGODB_URI below).
    plan: free
    region: frankfurt     # closest Render region to West Africa
    buildCommand: npm install --omit=dev   # installs the mongodb driver
    startCommand: node server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL          # e.g. https://bookbridge.onrender.com
        sync: false
      # --- Accounts database (MongoDB Atlas, free M0 cluster) ---
      - key: MONGODB_URI              # mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/
        sync: false
      - key: MONGODB_DB
        value: bookbridge
      # --- Payments (Paystack) ---
      - key: PAYSTACK_SECRET_KEY      # sk_test_... until you go live
        sync: false
      - key: BILLING_CURRENCY
        value: GHS
      - key: PLAN_SCHOOL_AMOUNT       # pesewas: 30000 = GH₵300
        value: "30000"
      - key: PLAN_NETWORK_AMOUNT
        value: "120000"
      - key: PLAN_SCHOOL_MAX_STUDENTS
        value: "1000"
      - key: PLAN_NETWORK_MAX_STUDENTS
        value: "5000"
      - key: TERM_MONTHS
        value: "4"
      - key: TERM_DISCOUNT_PERCENT
        value: "10"
      # --- Business details ---
      - key: BUSINESS_NAME
        value: BookBridge
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: BUSINESS_COUNTRY
        value: Ghana
